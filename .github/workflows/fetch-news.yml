name: 抓取时政热点

# 每天北京时间 07:00 / 12:00 / 20:00 各抓取一次；也可在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: '0 23 * * *' # 北京 07:00
    - cron: '0 4 * * *' # 北京 12:00
    - cron: '0 12 * * *' # 北京 20:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取并生成 JSON
        run: node scripts/fetch-news.mjs

      - name: 同步一份到站点根（供「Deploy from a branch」使用）
        run: |
          mkdir -p news
          cp public/news/today.json news/today.json
          cp public/news/archive.json news/archive.json

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news news
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(news): 更新时政热点 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
